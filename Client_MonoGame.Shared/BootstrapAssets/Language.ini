WarriorsDes=以强有力的体格为基础，特殊之处在于用剑法及刀法等技术。即便穿戴沉重的武器及对打猎、战斗比较适用。 体力强的战士能带许多东西，铠甲也可以自由活动。 但战士所戴的铠甲对魔法的防御能力相对较弱。
WizardDes=以长时间锻炼的内功为基础，能发挥强大的攻击型魔法。魔法攻击力卓越，但体力较弱。对体力上直接受到攻击的防御能力较低，另外，发挥高水平的魔法时需要较长时间，此时可能受到对方的快速攻击。 魔法师的魔法比任何攻击能力都强大，能有效的威胁对方。
TaoistDes=以强大的精神力作为基础，可以使用治疗术帮助别人。 对自然很熟悉，在用毒方面的能力最强。 博学多知，能使用剑术和魔法，所以每时每刻都能发挥多样的法术，随机应变性强。
AssassinDes=以敏捷快速的攻击为基础，矫健的刺客还拥有超强的爆发性他们熟悉各种技能 尤其擅长瞬移、潜行技能！ 他们是暗夜的主人，是绝对的伤害高、攻击高、爆发型的职业。
ArcherDes=强大的远程输出：作为一个名副其实的远程物理输出职业，弓箭最擅长在敌人攻击范围之外对敌人造成致命打击。 多变：弓箭手永远是战场上的未知数，就必须练就准确的判断力，熟练掌握其操作技巧 华丽：鲜艳的服装、优雅的射击动作和绚美的特效，非弓箭手莫属!
