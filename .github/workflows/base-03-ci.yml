name: BASE-03 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows-build:
    name: Windows build (solution filter)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup stable .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 验证 Markdown 相对链接
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $failures = [System.Collections.Generic.List[string]]::new()
          $markdownFiles = @(git -c core.quotepath=false ls-files '*.md')
          foreach ($relativeFile in $markdownFiles) {
            $fullFile = Join-Path $repoRoot $relativeFile
            $content = Get-Content -LiteralPath $fullFile -Raw
            foreach ($match in [regex]::Matches($content, '!?(?:\[[^\]]*\])\((?<target>[^)]+)\)')) {
              $target = $match.Groups['target'].Value.Trim()
              if ($target.StartsWith('<') -and $target.EndsWith('>')) {
                $target = $target.Substring(1, $target.Length - 2)
              }
              $target = ($target -split '\s+["'']', 2)[0]
              if ([string]::IsNullOrWhiteSpace($target) -or
                  $target.StartsWith('#') -or
                  $target -match '^[a-zA-Z][a-zA-Z0-9+.-]*:') {
                continue
              }
              $pathPart = ($target -split '[?#]', 2)[0]
              if ([string]::IsNullOrWhiteSpace($pathPart)) { continue }
              $decoded = [Uri]::UnescapeDataString($pathPart).Replace('/', [IO.Path]::DirectorySeparatorChar)
              $candidate = [IO.Path]::GetFullPath((Join-Path (Split-Path -Parent $fullFile) $decoded))
              if (-not (Test-Path -LiteralPath $candidate)) {
                $failures.Add("$relativeFile -> $target")
              }
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error -ErrorAction Continue $_ }
            throw "发现 $($failures.Count) 个失效的相对 Markdown 链接。"
          }
          Write-Host "已验证 $($markdownFiles.Count) 个受 Git 跟踪的 Markdown 文件。"

      - name: Bootstrap locked workload set
        run: dotnet workload restore Shared/Shared.csproj --verbosity minimal

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: windows-nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            windows-nuget-${{ runner.os }}-

      - name: Restore Windows solution filter
        run: dotnet restore LyoCrystal.Windows.slnf --verbosity minimal

      - name: Verify solution project inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diskProjects = @(
            Get-ChildItem -Path . -Recurse -Filter *.csproj -File |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj|Build|artifacts|graphify-out|_archived)[\\/]' } |
              ForEach-Object { [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName).Replace('/', '\') } |
              Sort-Object
          )
          $solutionProjects = @(
            dotnet sln 'Legend of Mir.sln' list |
              Where-Object { $_ -match '\.csproj$' } |
              ForEach-Object { $_.Trim().Replace('/', '\') } |
              Sort-Object
          )
          $difference = @(Compare-Object $solutionProjects $diskProjects)
          if ($difference.Count -ne 0) {
            $difference | Format-Table -AutoSize
            throw '磁盘工程与 Legend of Mir.sln 不一致。新增、移动或删除工程时必须同步主解决方案。'
          }
          Write-Host "Verified $($diskProjects.Count) projects in Legend of Mir.sln."

      - name: Restore SEC-01 client integration tests
        run: >-
          dotnet restore tests/WindowsIntegration/Sec01.ClientIntegration/Sec01.ClientIntegration.Windows.csproj
          -p:EnableAndroidTarget=false --verbosity minimal

      - name: Restore SEC-02 server config integration tests
        run: dotnet restore tests/WindowsIntegration/Sec02.ServerConfigIntegration/Sec02.ServerConfigIntegration.Windows.csproj --verbosity minimal

      - name: Restore SEC-02 client TLS integration tests
        run: dotnet restore tests/WindowsIntegration/Sec02.ClientTlsIntegration/Sec02.ClientTlsIntegration.Windows.csproj --verbosity minimal

      - name: Build Windows solution filter
        run: dotnet build LyoCrystal.Windows.slnf --configuration Release --no-restore --verbosity minimal

      - name: Run SEC-01 client integration tests
        run: >-
          dotnet test tests/WindowsIntegration/Sec01.ClientIntegration/Sec01.ClientIntegration.Windows.csproj
          --configuration Release --no-restore -p:EnableAndroidTarget=false --verbosity minimal

      - name: Run SEC-02 server config integration tests
        run: dotnet test tests/WindowsIntegration/Sec02.ServerConfigIntegration/Sec02.ServerConfigIntegration.Windows.csproj --configuration Release --no-restore --verbosity minimal

      - name: Run SEC-02 client TLS integration tests
        run: dotnet test tests/WindowsIntegration/Sec02.ClientTlsIntegration/Sec02.ClientTlsIntegration.Windows.csproj --configuration Release --no-restore --verbosity minimal

      - name: Upload Windows build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-03-windows-build
          path: '**/bin/Release/**'
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Android Release arm64 AOT publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup stable .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java for Android workload
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache NuGet and Android workload packs
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
          key: android-nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Client_MonoGame.Android/Client_MonoGame.Android.csproj', 'Client_MonoGame.Mobile.props', 'Client_MonoGame.Shared/Client_MonoGame.Shared.csproj') }}
          restore-keys: |
            android-nuget-${{ runner.os }}-

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Show SDK and workload state
        shell: pwsh
        run: dotnet --info

      - name: Publish Android Release arm64 AOT package
        shell: pwsh
        run: >-
          dotnet publish Client_MonoGame.Android/Client_MonoGame.Android.csproj
          -f net10.0-android
          -c Release
          -r android-arm64
          -p:MobileBootstrapAssetMode=Micro
          -p:AndroidPackageFormat=apk
          -p:ArchiveOnBuild=false
          -p:RunAOTCompilation=true
          -p:PublishTrimmed=true
          -v:minimal

      - name: Upload Android publish output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-03-android-arm64-aot
          path: Client_MonoGame.Android/bin/Release/net10.0-android/android-arm64/publish/**
          if-no-files-found: error
          retention-days: 7

  general-tests:
    name: General tests (discovered projects)
    # Base05 覆盖 DPAPI、Windows 卷隔离与真实 Windows 进程，必须在产品支持平台运行。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup stable .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Bootstrap locked workload set
        run: dotnet workload restore Shared/Shared.csproj --verbosity minimal

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: tests-nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            tests-nuget-${{ runner.os }}-

      - name: Restore protocol manifest generator
        run: dotnet restore tools/ProtocolManifestGenerator/ProtocolManifestGenerator.csproj --verbosity minimal

      - name: Verify generated protocol manifest
        run: >-
          dotnet run --project tools/ProtocolManifestGenerator/ProtocolManifestGenerator.csproj
          --configuration Release --no-restore --
          --verify Docs/protocol-wire-manifest.generated.json

      - name: Discover test projects
        id: discover
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            Get-ChildItem -Path . -Recurse -Filter *.csproj -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and
                ($_.BaseName -match '(?i)(^|[.])-?tests?$' -or $_.FullName -match '[\\/]Tests[\\/]') -and
                @(
                  Select-Xml -LiteralPath $_.FullName -XPath "//*[local-name()='IsTestProject' and translate(normalize-space(.),'TRUE','true')='true']"
                ).Count -gt 0
              }
          )
          if ($projects.Count -eq 0) {
            'count=0' >> $env:GITHUB_OUTPUT
            Write-Error -ErrorAction Continue 'No test project with IsTestProject=true discovered. BASE-05 test implementation is required.'
            exit 1
          }
          $projects | ForEach-Object { $_.FullName } | Set-Content -Encoding UTF8 test-projects.txt
          "count=$($projects.Count)" >> $env:GITHUB_OUTPUT
          $projects | ForEach-Object { Write-Host "Discovered test project: $($_.FullName)" }

      - name: Run discovered test projects
        if: steps.discover.outputs.count != '0'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsRoot = Join-Path (Get-Location) 'TestResults'
          $runRoot = Join-Path $resultsRoot ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runRoot -Force | Out-Null
          [int]$projectCount = 0
          [long]$totalExecuted = 0
          foreach ($project in Get-Content -LiteralPath test-projects.txt) {
            if ([string]::IsNullOrWhiteSpace($project)) { continue }
            $projectCount++
            $projectRoot = Join-Path $runRoot ("project-{0}" -f $projectCount)
            New-Item -ItemType Directory -Path $projectRoot -Force | Out-Null
            dotnet test $project --configuration Release --logger 'trx;LogFileName=test-results.trx' --results-directory $projectRoot --verbosity normal
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) { exit $testExit }

            $trxFiles = @(Get-ChildItem -LiteralPath $projectRoot -Filter '*.trx' -File -Recurse)
            if ($trxFiles.Count -eq 0) {
              Write-Error "No TRX result was produced for $project."
              exit 1
            }
            [long]$projectTotal = 0
            [long]$projectExecuted = 0
            foreach ($trxFile in $trxFiles) {
              try {
                [xml]$trx = Get-Content -LiteralPath $trxFile.FullName -Raw -ErrorAction Stop
              }
              catch {
                Write-Error "Unable to parse TRX $($trxFile.FullName): $($_.Exception.Message)"
                exit 1
              }
              $counters = $trx.TestRun.ResultSummary.Counters
              if ($null -eq $counters) {
                Write-Error "TRX $($trxFile.FullName) has no ResultSummary/Counters."
                exit 1
              }
              [long]$total = 0
              [long]$executed = 0
              if (-not [long]::TryParse([string]$counters.total, [ref]$total) -or
                  -not [long]::TryParse([string]$counters.executed, [ref]$executed)) {
                Write-Error "TRX $($trxFile.FullName) has invalid total/executed counters."
                exit 1
              }
              if ($total -le 0 -or $executed -le 0) {
                Write-Error "TRX $($trxFile.FullName) reports total=$total executed=$executed."
                exit 1
              }
              $projectTotal += $total
              $projectExecuted += $executed
            }
            if ($projectTotal -le 0 -or $projectExecuted -le 0) {
              Write-Error "Test project $project produced no executed tests."
              exit 1
            }
            $totalExecuted += $projectExecuted
            Write-Host "Validated $($project): total=$projectTotal executed=$projectExecuted"
          }
          if ($projectCount -le 0 -or $totalExecuted -le 0) {
            Write-Error "No executed tests were validated across discovered projects."
            exit 1
          }
          Write-Host "Validated executed tests: projects=$projectCount total=$totalExecuted"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-03-test-results
          path: TestResults/**
          if-no-files-found: error
          retention-days: 7
