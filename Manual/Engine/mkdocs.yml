site_name: LyoCrystal 引擎说明书
site_description: LyoCrystal 服务端、脚本、功能系统和运维的产品说明书
site_author: LyoCrystal 项目
copyright: LyoCrystal 项目说明书
docs_dir: docs
site_dir: site
use_directory_urls: false
strict: true

theme:
  name: material
  language: zh
  logo: assets/brand/lyocrystal-mark.svg
  favicon: assets/brand/lyocrystal-mark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang: zh
      jieba_dict_user: search-dictionary.txt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  status:
    planned: 规划中
    experimental: 实验性
    implemented: 已实现

nav:
  - 首页: index.md
  - 快速开始:
      - 阅读与查询说明书: getting-started/index.md
  - 脚本开发:
      - 脚本开发入口: scripting/index.md
      - 原生 TXT 与控制流: scripting/txt-compatibility.md
      - 人物、物品与金币命令: scripting/player-commands.md
      - 地图、怪物与宝宝命令: scripting/world-commands.md
      - 行会、任务与经济命令: scripting/social-quest-commands.md
      - 翎风商店、配方与规则名单: scripting/commerce-content.md
      - 翎风 Envir 外部依赖预检: scripting/external-dependencies.md
      - TXT 系统入口与基础触发: scripting/txt-system-hooks.md
      - NPC 对话、按钮与客户端: scripting/npc-dialog-ui.md
      - 高风险外部能力: scripting/high-risk-capabilities.md
      - 翎风 TXT 兼容声明: scripting/lingfeng-txt-compatibility-statement.md
      - 变量系统:
          - 变量系统入口: scripting/variables.md
          - 变量系统概览: scripting/variables/overview.md
          - 作用域与生命周期: scripting/variables/scopes.md
          - 私人持久变量与数据库: scripting/variables/persistence.md
          - 全局持久变量与数据库: scripting/variables/global-persistence.md
          - 每日周期变量: scripting/variables/daily-variables.md
          - 自定义持久作用域: scripting/variables/custom-scopes.md
          - 声明、初始化与热重载: scripting/variables/declarations.md
          - 命名小数变量: scripting/variables/decimal.md
          - 操作与显示命令: scripting/variables/commands.md
          - 列表 L$ 与字典 D$: scripting/variables/composites.md
          - 公式、概率与格式化: scripting/variables/formula-probability.md
          - 当前目标与跨角色变量: scripting/variables/cross-object.md
          - 兼容模式与迁移: scripting/variables/compatibility-migration.md
          - 只读系统占位符: scripting/variables/read-only-symbols.md
          - C# 脚本变量 API: scripting/variables/csharp-api.md
          - 完整使用示例: scripting/variables/examples.md
          - 错误与排查: scripting/variables/errors.md
  - 版本说明:
      - 2026-08-15 翎风 TXT 生产候选: releases/2026-08-15-lingfeng-txt.md
      - 2026-08-15 变量系统 VAR-01: releases/2026-08-15-var01.md
      - 2026-08-15 变量系统 VAR-02: releases/2026-08-15-var02.md
      - 2026-08-15 变量系统 VAR-03: releases/2026-08-15-var03.md
      - 2026-08-15 变量系统 VAR-04: releases/2026-08-15-var04.md
      - 2026-08-15 变量系统 VAR-05: releases/2026-08-15-var05.md
      - 2026-08-15 变量系统 VAR-06: releases/2026-08-15-var06.md
