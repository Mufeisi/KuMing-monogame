[FairyGUI]
; 主界面按钮映射覆盖（用于关键字未命中时的精确绑定）
; MobileMainHud.<ActionKey>=<Spec>
; ActionKey: Pickup/Attack/AutoRun/AutoHit/AttackMode/Magic/Inventory/Chat/Shop/System
; Spec 支持：
;   - path:<NamePath>   例如：path:Root/Panel/BtnBag
;   - idx:<IndexPath>   例如：idx:0/3/2
;   - name:<ExactName>
;   - item:<ExactPackageItemName>
;   - url:<ExactResourceURL>
;   - title:<ExactButtonTitle>
;   - 关键字列表：a|b|c

; 小地图命中覆盖（用于双指手势允许规则：pinch/双指点击）
; MobileMainHud.MiniMap=<Spec>
;   例如：MobileMainHud.MiniMap=idx:0/3/2
