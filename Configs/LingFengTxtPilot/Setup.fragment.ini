[CSharpScripts]
CSharpScriptsEnabled=true
CSharpScriptsFallbackToTxt=true

[TxtScripts]
TxtScriptsEnabled=true
TxtScriptsPath=Configs/LingFengTxtPilot/Content
TxtScriptsLayout=LyoCrystal
TxtScriptsMaxFileBytes=1048576
TxtScriptsSourcePriority=CSharpFirst
TxtScriptsHotReloadEnabled=true
TxtScriptsDebounceMs=500
TxtScriptsMaxImmediateTransitions=64
TxtScriptsCompatibilityVersion=LFM2-2026-08-15-snapshot
TxtScriptsStrictCompatibility=true
TxtScriptsHighRiskCapabilitiesEnabled=false
TxtScriptsAllowedHttpsHosts=
TxtScriptsLogLoads=true
TxtScriptsLogDispatch=true
TxtScriptsUsageTraceEnabled=true

[ScriptMetrics]
Enabled=true
AutoDumpSeconds=60
MaxKeys=2000
